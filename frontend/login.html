<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - NexusCon</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">

  <nav class="navbar">
    <a href="index.html" class="brand">NexusCon</a>
    <div class="nav-links">
      <a href="index.html">Events</a>
      <a href="admin.html" id="adminLink" style="display:none;">Admin</a>
      <span id="userGreeting"></span>
      <a href="login.html" id="loginLink">Login</a>
      <a href="register.html" id="registerLink">Register</a>
      <button id="logoutBtn" style="display:none;">Logout</button>
    </div>
  </nav>

  <div class="auth-wrapper">
    <div class="auth-card">
      <h1>Welcome Back</h1>
      <p class="subtitle">Login to book your tickets</p>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="you@example.com">
          <div class="error-msg" id="emailError"></div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Your password">
          <div class="error-msg" id="passwordError"></div>
        </div>

        <label class="show-pass">
          <input type="checkbox" id="showPassword"> Show password
        </label>

        <button type="submit" class="btn">Login</button>
        <div class="form-message" id="formMessage"></div>
      </form>

      <p class="switch-link">New here? <a href="register.html">Create an account</a></p>
    </div>
  </div>

  <script src="js/navbar.js"></script>
  <script src="js/auth.js"></script>
  <a href="index.html" class="back-home">&larr; Back to Home</a>
   <h1>Welcome Back</h1>
</body>
</html>
