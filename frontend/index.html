 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexusCon - Anime & Esports Events</title>
  <link rel="stylesheet" href="css/home.css">
  <link rel="stylesheet" href="css/notifications.css">
</head>
<body class="home-page">

  <nav class="navbar">
    <a href="index.html" class="brand">NexusCon</a>
    <div class="nav-links">
      <a href="index.html">Events</a>
      <a href="profile.html">My Bookings</a>
      <a href="admin.html" id="adminLink" style="display:none;">Admin</a>
      <span id="userGreeting"></span>
      <a href="login.html" id="loginLink">Login</a>
      <a href="register.html" id="registerLink">Register</a>
      <button id="logoutBtn" style="display:none;">Logout</button>
    </div>
  </nav>

  <section class="hero">
    <h1>Anime Conventions &amp; Esports Tournaments</h1>
    <p>Pick your favourite event and book your seat.</p>
  </section>

  <section class="filters">
    <input type="text" id="searchBox" placeholder="Search by event name or venue...">
    <select id="categoryFilter">
      <option value="">All categories</option>
    </select>
    <label class="filter-label">From <input type="date" id="dateFrom"></label>
<label class="filter-label">To <input type="date" id="dateTo"></label>
<input type="number" id="minPrice" placeholder="Min Rs" min="0">
<input type="number" id="maxPrice" placeholder="Max Rs" min="0">
<select id="sortSelect">
  <option value="date">Sort: Date (soonest)</option>
  <option value="price-low">Sort: Price (low to high)</option>
  <option value="price-high">Sort: Price (high to low)</option>
</select>
<button type="button" id="clearFilters" class="clear-btn">Clear</button>
  </section>

  <main>
    <div id="eventsGrid" class="events-grid">Loading events...</div>
    <div id="pagination" class="pagination"></div>
  </main>

  <script src="js/home.js"></script>
  <script src="js/notifications.js"></script>
</body>
</html>
