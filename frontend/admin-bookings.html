<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Bookings - NexusCon</title>
  <link rel="stylesheet" href="css/home.css">
  <link rel="stylesheet" href="css/booking.css">
  
</head>
<body class="home-page">

  <nav class="navbar">
    <a href="index.html" class="brand">NexusCon</a>
    <div class="nav-links">
      <a href="index.html">Events</a>
      <a href="profile.html">My Bookings</a>
      <a href="admin.html" id="adminLink" style="display:none;">Admin</a>
      <span id="userGreeting"></span>
      <a href="login.html" id="loginLink">Login</a>
      <a href="register.html" id="registerLink">Register</a>
      <button id="logoutBtn" style="display:none;">Logout</button>
    </div>
  </nav>

<div class="page-wrap">
  <a class="back-link" href="admin.html">&larr; Back to admin</a>
  <h1>Manage Bookings</h1>
  <div class="filter-bar">
    <input type="text" id="searchInput" placeholder="Search name, email, event or booking ID">
    <select id="statusFilter">
      <option value="">All statuses</option>
      <option value="confirmed">Confirmed</option>
      <option value="cancelled">Cancelled</option>
    </select>
    <button id="exportBtn" class="book-btn">Export CSV</button>
  </div>
  <div id="bookingsTable">Loading...</div>
</div>
<script src="js/admin-bookings.js"></script>

   
</body>
</html>
