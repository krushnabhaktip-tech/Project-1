<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexusCon - Admin Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-page">

  <header class="admin-header">
    <div>
      <h1>NexusCon Admin</h1>
      <p class="subtitle">Manage your events</p>
    </div>
     <div class="admin-user">
  <a href="index.html" class="btn btn-outline back-home">&larr; Back to Home</a>
  <span>Welcome, <strong id="adminName"></strong></span>
  <button id="logoutBtn" class="btn btn-outline">Logout</button>
     </div>
  </header>

  <main class="admin-main">

    <section id="eventsSection" class="panel">
      <h2>All Events (<span id="eventCount">0</span>)</h2>
      <div id="eventsList">Loading events...</div>
    </section>

    <section id="formSection" class="panel">
      <h2 id="formTitle">Create New Event</h2>

      <form id="eventForm" class="admin-form">
        <label for="title">Title *</label>
        <input type="text" id="title" placeholder="e.g. NexusCon Valorant Championship" required>

        <label for="description">Description</label>
        <textarea id="description" rows="3" placeholder="Write a short description of the event"></textarea>

        <label for="category">Category *</label>
        <select id="category" required>
          <option value="" disabled selected>Select a category</option>
          <option value="Anime Con">Anime Con</option>
          <option value="Valorant">Valorant</option>
          <option value="Free Fire">Free Fire</option>
        </select>

        <label for="venue">Venue *</label>
        <input type="text" id="venue" placeholder="e.g. NexusCon Main Arena" required>

        <label for="event_date">Date and Time *</label>
        <input type="datetime-local" id="event_date" required>

        <div class="form-row">
          <div>
            <label for="price">Price (Rs)</label>
            <input type="number" id="price" placeholder="500" min="0">
          </div>
          <div>
            <label for="total_seats">Total Seats *</label>
            <input type="number" id="total_seats" placeholder="100" min="1" required>
          </div>
        </div>

        <label for="poster_url">Poster URL</label>
        <input type="text" id="poster_url" placeholder="https://...">

        <label for="status">Status</label>
        <select id="status">
          <option value="upcoming">upcoming</option>
          <option value="live">live</option>
          <option value="closed">closed</option>
        </select>

        <div class="form-buttons">
          <button type="submit" id="saveBtn" class="btn btn-primary">Create Event</button>
          <button type="button" id="cancelBtn" class="btn btn-outline">Cancel</button>
        </div>
      </form>

      <p id="message" class="message"></p>
    </section>

  </main>

  <script src="js/admin.js"></script>
</body>
</html>
