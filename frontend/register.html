<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - NexusCon</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-card">
    <h1>Create Account</h1>
    <p class="subtitle">Join NexusCon and book your seat</p>

    <form id="registerForm" novalidate>
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" placeholder="Your name">
        <div class="error-msg" id="nameError"></div>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com">
        <div class="error-msg" id="emailError"></div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Min 8 chars, letters and numbers">
        <div class="error-msg" id="passwordError"></div>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" placeholder="Repeat password">
        <div class="error-msg" id="confirmError"></div>
      </div>

      <label class="show-pass">
        <input type="checkbox" id="showPassword"> Show password
      </label>

      <button type="submit" class="btn">Register</button>
      <div class="form-message" id="formMessage"></div>
    </form>

    <p class="switch-link">Already have an account? <a href="login.html">Login</a></p>
  </div>

  <script src="js/auth.js"></script>
</body>
</html>
